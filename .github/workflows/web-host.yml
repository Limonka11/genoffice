name: web-host bundle

on:
  push:
    branches: [vound]
    paths: ['web-full/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/web-host.yml']
  workflow_dispatch:

# The repository's default token is read-only; creating the release needs write.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npm run build:web-host
      - name: Unit tests of the engine change
        run: npx vitest run tests/field-paragraph-text-patch.test.ts
        working-directory: packages/docx-engine
      # npm layout: one package/ root holding package.json, COMMIT, the licence
      # files and the static files, so the app can install the asset by URL.
      # --short=8 keeps the tag as long as a full local clone prints it.
      - name: Pack the bundle as an npm tarball with its commit in the name
        run: |
          SHORT=$(git rev-parse --short=8 HEAD)
          ASSET="genoffice-web-host-$SHORT.tar.gz"
          mkdir package
          cp -R web-full/dist/. package/
          cp LICENSE LICENSE-UNICODE.txt NOTICE package/
          printf '{"name":"@vound/genoffice-web-host","version":"0.0.0-%s","license":"Apache-2.0"}\n' "$SHORT" > package/package.json
          echo "$SHORT" > package/COMMIT
          tar -czf "$ASSET" package
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
      - name: Publish as a release asset (tag web-host-<commit>)
        if: github.event_name == 'push'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "web-host-$SHORT" "$ASSET" --target "$GITHUB_SHA" --title "web-host $SHORT" --notes "Static GenOffice Docs host built from $GITHUB_SHA, packed as the npm package @vound/genoffice-web-host. Serve it under the app's /editor/$SHORT/ path." || gh release upload "web-host-$SHORT" "$ASSET" --clobber
